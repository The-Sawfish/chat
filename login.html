<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — Signal Line</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="mark">#</div>
        <span>Signal Line</span>
      </div>
      <h1>Welcome back</h1>
      <p class="sub">Log in to see your chats.</p>

      <div class="form-error" id="errorBox"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Log in</button>
      </form>

      <div class="auth-switch">
        Don't have an account? <a href="signup.html">Sign up</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { logIn, friendlyAuthError, watchAuth } from "./js/auth.js";

    // If already logged in, skip straight to the app.
    watchAuth((user) => { if (user) window.location.href = "index.html"; });

    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("errorBox");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.remove("show");
      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in…";
      try {
        await logIn(
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
        window.location.href = "index.html";
      } catch (err) {
        errorBox.textContent = friendlyAuthError(err);
        errorBox.classList.add("show");
        submitBtn.disabled = false;
        submitBtn.textContent = "Log in";
      }
    });
  </script>
</body>
</html>
