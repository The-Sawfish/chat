<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "ab5cc088-86f4-4346-bf1b-7362f6a836e6",
    });
  });
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Signal Line</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="app" id="app">

  <!-- Icon rail -->
  <div class="rail">
    <div class="mark">#</div>
    <button class="rail-btn active" id="navChats" title="Chats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    </button>
    <button class="rail-btn" id="navContacts" title="Contacts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    </button>
    <div class="rail-spacer"></div>
    <button class="rail-btn" id="navLogout" title="Log out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
    <div class="rail-avatar" id="myAvatar">–</div>
  </div>

  <!-- Chats list -->
  <div class="list-pane" id="chatsPane">
    <div class="list-header">
      <h2>Chats <span class="my-number" id="myNumberBadge">#…</span></h2>
      <div class="search-box" style="display:flex; gap:8px;">
        <input type="text" id="chatSearch" placeholder="Search chats" />
        <button class="icon-btn" id="newGroupBtn" title="New group">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/></svg>
        </button>
      </div>
    </div>
    <div class="scroll-list" id="chatList">
      <div class="empty-hint">No chats yet. Add a contact by their 5-digit number to start one.</div>
    </div>
  </div>

  <!-- Contacts list (hidden by default) -->
  <div class="list-pane" id="contactsPane" style="display:none;">
    <div class="list-header">
      <h2>Contacts
        <button class="icon-btn" id="addContactBtn" title="Add contact">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </h2>
      <div class="search-box">
        <input type="text" id="contactSearch" placeholder="Search contacts" />
      </div>
    </div>
    <div class="scroll-list" id="contactList">
      <div class="empty-hint">No contacts yet. Tap + and enter someone's 5-digit number to add them.</div>
    </div>
  </div>

  <!-- Chat pane -->
  <div class="chat-pane empty" id="chatPane">
    <div class="empty-state">
      <div class="mark">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6b6c78" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      </div>
      <p>Select a chat, or add a contact to start a new one.</p>
    </div>
  </div>

</div>

<!-- Add contact modal -->
<div class="modal-backdrop" id="addContactModal">
  <div class="modal">
    <h3>Add a contact</h3>
    <p class="sub">Enter their 5-digit number.</p>
    <div class="form-error" id="addContactError"></div>
    <div class="field">
      <label for="contactNumberInput">Number</label>
      <input type="text" id="contactNumberInput" maxlength="5" inputmode="numeric" placeholder="e.g. 48213" />
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancelAddContact">Cancel</button>
      <button class="btn-primary" id="confirmAddContact">Add</button>
    </div>
  </div>
</div>

<!-- New group modal -->
<div class="modal-backdrop" id="newGroupModal">
  <div class="modal">
    <h3>New group</h3>
    <p class="sub">Name it and pick who's in.</p>
    <div class="form-error" id="newGroupError"></div>
    <div class="field">
      <label for="groupNameInput">Group name</label>
      <input type="text" id="groupNameInput" maxlength="40" placeholder="e.g. Weekend Trip" />
    </div>
    <div class="pick-list" id="groupPickList"></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancelNewGroup">Cancel</button>
      <button class="btn-primary" id="confirmNewGroup">Create</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
